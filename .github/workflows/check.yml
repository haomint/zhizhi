name: Check

# `web`: same gate as `npm run check` locally: format, tests (incl. architecture rules),
# strict typecheck, production build, doctor. PRs must pass before merging.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outputs/learning-grove
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: outputs/learning-grove/package-lock.json

      - run: npm ci
      - run: npm run check

  # Playwright scenarios against the production build (npm run test:browser).
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outputs/learning-grove
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: outputs/learning-grove/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - name: Upload screenshots and failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: outputs/learning-grove/test-results/browser/
