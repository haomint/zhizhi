<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>知枝 · 独立运行验证</title>
<style>body{margin:0;background:#eef4ed;color:#293f35;font:17px/1.8 system-ui;padding: max(30px,env(safe-area-inset-top)) 22px 40px}main{max-width:520px;margin:auto}h1{font-size:27px}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;border:1px solid #cad8c9;border-radius:16px;padding:12px;margin:6px 0;background:#fff}button{background:#365e49;color:white;min-height:48px}button:disabled{opacity:.5}article{white-space:pre-wrap;background:#fffdf6;border-radius:24px;padding:24px;margin:24px 0}small{color:#61776a}#status{min-height:2em}label{display:block;margin-top:12px}</style>
<main><h1>知枝</h1><small>独立运行验证 · 已保存的卡片可离线阅读</small>
<details><summary>模型设置</summary><label>API Key<input id="key" type="password" autocomplete="off" placeholder="仅在手机上加密保存"></label><button id="save">保存密钥</button><label>模型名称<input id="model" value="deepseek-flash" spellcheck="false"></label></details>
<label>想学什么？<textarea id="topic" rows="3" placeholder="例如：用生活案例理解导数"></textarea></label><button id="generate">生成一张卡片</button><p id="status" role="status"></p><article id="card" hidden></article></main><script src="capacitor-runtime.js"></script><script src="mobile-check.js"></script></html>
