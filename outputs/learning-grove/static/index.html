<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f2">
  <title>知枝 · 私人学习助手</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/reader.css">
  <link rel="stylesheet" href="/garden.css">
  <script defer src="/capacitor-runtime.js"></script>
  <script defer src="/mobile-service.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="知枝首页"><span class="brand-mark"><svg width="31" height="36" viewBox="0 0 32 38" fill="none" aria-hidden="true"><path d="M16 34V13m0 12-7-5m7-2 7-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 12c7-2 10 2 8 8-7 1-10-2-8-8ZM21 5c8-2 11 3 7 9-7 0-9-3-7-9ZM11 3c6-1 9 3 6 8-6 0-8-3-6-8Z" fill="currentColor" opacity=".8"/></svg></span><span>知枝<small>LEARNING GROVE</small></span></a>
      <button class="primary new-tree" data-action="new">＋ 开始一段学习</button>
      <nav aria-label="主导航">
        <a href="#home" data-nav="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg> 学习空间</a>
        <a href="#profile" data-nav="profile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8m-8 4h8m-8 4h5"/></svg> 个人资料库 <b id="memory-count">0</b></a>
      </nav>
      <div class="sidebar-label">正在生长</div>
      <div id="tree-nav" class="tree-nav"></div>
      <div class="sidebar-bottom">
        <div class="local-note"><i></i> 个人空间 · 保存在本机</div>
        <button class="text-button" data-action="settings">⚙ 模型设置 <span id="mode-mini"></span></button>
        <button class="text-button" data-action="export">↗ 导出学习档案</button>
        <div class="version">知枝 / 轻阅读版 0.4</div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div id="breadcrumbs">学习空间</div><div><button id="mode-badge" class="badge" data-action="settings" aria-label="模型设置"></button><span class="saved" id="save-status">已保存至本机</span></div></header>
      <main id="main" tabindex="-1"><div class="loading-page">正在打开你的学习空间…</div></main>
    </div>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
