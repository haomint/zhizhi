: "f(x)=x² 在 x=2 连续：当 x 接近 2，x² 接近 4，而 f(2) 也等于 4。", "image": ""}, {"id": "ad9a8ad9939c", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "如果极限是 4，但人为把该点函数值设成 7，那里还连续吗？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 2, "messages": [], "links": [], "page": 0}, {"id": "6b40735aeffd", "title": "变化量", "chapter": "02 · 理解变化", "description": "变化量是终点值减去起点值。用 Δx 表示输入变化，用 Δy 表示输出变化；它们分别回答变化了多少。", "status": "unseen", "cards": [{"id": "60e6b3c0d0e4", "kind": "核心概念", "title": "变化量", "text": "变化量是终点值减去起点值。用 Δx 表示输入变化，用 Δy 表示输出变化；它们分别回答变化了多少。", "image": ""}, {"id": "8c19cd12ffdc", "kind": "具体案例", "title": "换个角度理解", "text": "小车从第 2 秒的 4 米走到第 5 秒的 25 米：Δt=3 秒，Δs=21 米。", "image": ""}, {"id": "018a24886a07", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "同样增加 10 米，用 2 秒和用 5 秒有什么区别？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 3, "messages": [], "links": [], "page": 0}, {"id": "285381cb1619", "title": "平均变化率", "chapter": "02 · 理解变化", "description": "平均变化率等于 Δy/Δx。它把输出的变化量与输入变化量联系起来，描述整个区间的平均情况。", "status": "unseen", "cards": [{"id": "1942c6ef7325", "kind": "核心概念", "title": "平均变化率", "text": "平均变化率等于 Δy/Δx。它把输出的变化量与输入变化量联系起来，描述整个区间的平均情况。", "image": ""}, {"id": "8f45e79866ff", "kind": "具体案例", "title": "换个角度理解", "text": "若位置 s(t)=t²，从 t=1 到 t=3：平均速度=(9−1)/(3−1)=4。这里的位置单位为米，时间单位为秒。", "image": ""}, {"id": "aa1ae15e3edd", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "平均变化率等于 4，是否意味着区间里每个时刻的变化率都是 4？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 4, "messages": [], "links": [], "page": 0}, {"id": "b98d475e0f25", "title": "导数的定义", "chapter": "02 · 理解变化", "description": "导数是平均变化率在区间不断缩小时的极限：f′(x)=lim[h→0] (f(x+h)−f(x))/h。这个极限存在时，才说该点可导。", "status": "unseen", "cards": [{"id": "e03941f495a7", "kind": "核心概念", "title": "导数的定义", "text": "导数是平均变化率在区间不断缩小时的极限：f′(x)=lim[h→0] (f(x+h)−f(x))/h。这个极限存在时，才说该点可导。", "image": ""}, {"id": "d6845964c5fb", "kind": "具体案例", "title": "换个角度理解", "text": "f(x)=x² 时，差商为 ((x+h)²−x²)/h=2x+h。令 h 趋于 0，得到 f′(x)=2x。", "image": ""}, {"id": "fc7c6f6db3f7", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "在 x=3 时，x² 的瞬时变化率是多少？它与 f(3) 有什么区别？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 5, "messages": [], "links": [], "page": 0}, {"id": "9691b7a4b7c6", "title": "切线与导数", "chapter": "03 · 走近导数", "description": "在通常的可导情形下，导数给出曲线在该点的切线斜率。函数值确定点的位置，导数描述附近的变化方向和快慢。", "status": "unseen", "cards": [{"id": "9c452f8ec9dd", "kind": "核心概念", "title": "切线与导数", "text": "在通常的可导情形下，导数给出曲线在该点的切线斜率。函数值确定点的位置，导数描述附近的变化方向和快慢。", "image": ""}, {"id": "920560716957", "kind": "具体案例", "title": "换个角度理解", "text": "y=x² 在 x=1 处经过 (1,1)，导数为 2。因此切线是 y−1=2(x−1)。", "image": ""}, {"id": "7bd5c71531ce", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "切线经过某点，是否意味着它在其他位置也与曲线完全重合？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 6, "messages": [], "links": [], "page": 0}, {"id": "7792767dc5ca", "title": "基本求导", "chapter": "03 · 走近导数", "description": "常数的导数为 0；xⁿ 在相应定义域内的导数为 nxⁿ⁻¹。和的导数等于各项导数之和。先识别结构，再选规则。", "status": "unseen", "cards": [{"id": "f3e9a897bdd1", "kind": "核心概念", "title": "基本求导", "text": "常数的导数为 0；xⁿ 在相应定义域内的导数为 nxⁿ⁻¹。和的导数等于各项导数之和。先识别结构，再选规则。", "image": ""}, {"id": "a371a81ef434", "kind": "具体案例", "title": "换个角度理解", "text": "f(x)=3x²+2x+5，则 f′(x)=6x+2。常数 5 改变曲线的高度，但不改变斜率。", "image": ""}, {"id": "9305da43c1c0", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "为什么给函数整体加上一个常数，导数却不变？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 7, "messages": [], "links": [], "page": 0}, {"id": "6b6f0c48c81c", "title": "驻点与极值", "chapter": "03 · 走近导数", "description": "导数为 0 的点称为驻点。驻点可能是局部极值的候选，但单凭导数为 0，不能断定一定存在极值。", "status": "unseen", "cards": [{"id": "105e3e7397e8", "kind": "核心概念", "title": "驻点与极值", "text": "导数为 0 的点称为驻点。驻点可能是局部极值的候选，但单凭导数为 0，不能断定一定存在极值。", "image": ""}, {"id": "989dcc4dca51", "kind": "具体案例", "title": "换个角度理解", "text": "f(x)=x³ 在 x=0 的导数为 0，但函数在该点两侧仍持续增大，所以这里不是局部极大或极小。", "image": ""}, {"id": "3e670c54e549", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "判断一个驻点是不是极值，还可以观察它两侧的什么变化？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 8, "messages": [], "links": [], "page": 0}, {"id": "11e361f6fa5e", "title": "优化的起点", "chapter": "04 · 连接应用", "description": "优化问题先确定目标函数和允许取值范围，再寻找候选点，比较驻点及边界等位置。应用求导前，建模往往更关键。", "status": "unseen", "cards": [{"id": "ee6b0e397246", "kind": "核心概念", "title": "优化的起点", "text": "优化问题先确定目标函数和允许取值范围，再寻找候选点，比较驻点及边界等位置。应用求导前，建模往往更关键。", "image": ""}, {"id": "51d7c8962fd8", "kind": "具体案例", "title": "换个角度理解", "text": "周长为 20 的矩形，若一边为 x，另一边为 10−x。面积 A=x(10−x)，0<x<10；A′=10−2x，在 x=5 时取得最大面积。", "image": ""}, {"id": "12c9fbeeaca8", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "为什么求出了驻点以后，还要检查定义域和问题中的约束？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 9, "messages": [], "links": [], "page": 0}, {"id": "1af1cb839f8e", "title": "积分的直觉", "chapter": "04 · 连接应用", "description": "定积分可以理解为许多微小贡献的累积。把区间细分、求和并取极限，可以建立严谨定义。面积是它的一种直观解释。", "status": "unseen", "cards": [{"id": "ee1e519f90ca", "kind": "核心概念", "title": "积分的直觉", "text": "定积分可以理解为许多微小贡献的累积。把区间细分、求和并取极限，可以建立严谨定义。面积是它的一种直观解释。", "image": ""}, {"id": "26df1fe390f2", "kind": "具体案例", "title": "换个角度理解", "text": "若速度始终为每秒 3 米，那么 4 秒累积的路程为 12 米；图上对应宽为 4、高为 3 的矩形面积。", "image": ""}, {"id": "42d5644a5312", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "如果速度随时间变化，为什么只用某一时刻的速度乘总时间通常不够？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 10, "messages": [], "links": [], "page": 0}, {"id": "534e26b7db0e", "title": "变化与累积", "chapter": "04 · 连接应用", "description": "微分研究局部变化，积分研究整体累积。微积分基本定理在适当条件下把二者联系起来，这是后续学习的重要主线。", "status": "unseen", "cards": [{"id": "eb1707eb72f4", "kind": "核心概念", "title": "变化与累积", "text": "微分研究局部变化，积分研究整体累积。微积分基本定理在适当条件下把二者联系起来，这是后续学习的重要主线。", "image": ""}, {"id": "5dac6844f1e3", "kind": "具体案例", "title": "换个角度理解", "text": "F(x)=x²，则 F′(x)=2x。在区间 [0,2] 上累积 2x，结果等于 F(2)−F(0)=4。", "image": ""}, {"id": "718469d87c2a", "kind": "停下来想一想", "title": "把理解变成自己的话", "text": "你能分别举一个关注变化快慢、一个关注累积总量的问题吗？", "image": ""}], "ready": true, "parent_id": "", "demo_index": 11, "messages": [], "links": [], "page": 0}], "demo": true, "sources": [], "source_status": "演示内容，未进行联网检索"}], "memories": [], "draft": {"messages": [], "summary": null}, "revision": 0},previewSettings={"provider": "deepseek", "enabled": false, "has_key": false, "can_remember": false, "model": "deepseek-flash", "base_url": "https://api.deepseek.com", "test_status": "untested"};
window.fetch=async(url,opts)=>{let ok=true,error='此文件仅供手机界面预览，真实 AI 功能请在正式应用中使用。';let tree=previewState.trees[0];if(opts){let a=JSON.parse(opts.body),n=tree.nodes.find(n=>n.id===a.node_id)||tree.nodes[0];if(a.type==='set_page')n.page=Math.max(0,Math.min(a.page,n.cards.length-1));else if(a.type==='visit')tree.current_node_id=n.id;else if(a.type==='demo'){}else if(a.type==='chat'){n.messages.push({role:'user',content:a.message,card_id:a.card_id},{role:'assistant',content:'这是离线预览的固定回答。你可以上翻参照卡片、切换页面，体验布局。正式应用会结合历史记录回答。',card_id:a.card_id});}else if(a.type==='advance'){n.status='read';let next=tree.nodes[tree.nodes.indexOf(n)+1];if(next)tree.current_node_id=next.id;return {ok:true,json:async()=>({state:previewState,settings:previewSettings,next_node_id:next?.id||''})};}else if(a.type==='refill'){}else ok=false;}return{ok,json:async()=>({state:previewState,settings:previewSettings,tree_id:tree.id,error})};};

'use strict';
let state = null, config = null, busy = false, memoryFilter = '全部', memoryQuery = '', toastTimer;
const chatDrafts = new Map();
const currentCard = () => { const n=currentNode(); return n?.cards[Math.min(n.page||0,Math.max(0,n.cards.length-1))]; };
const contextKey = () => currentTree() && currentNode() ? currentTree().id + '/' + currentNode().id + '/' + (currentCard()?.id||'empty') : '';
const questionOpen = new Set(), scrollPositions = new Map();
let readerObserver;
function keepReaderPosition(){if(route()[0]==='tree'&&currentTree()){const key=contextKey();scrollPositions.set(key,window.scrollY||0);try{sessionStorage.setItem('grove-reader-scroll:'+key,String(window.scrollY||0));}catch{}}}
function restoreReaderPosition(){const key=contextKey();let y=scrollPositions.get(key);try{y??=Number(sessionStorage.getItem('grove-reader-scroll:'+key)||0);}catch{}requestAnimationFrame(()=>window.scrollTo(0,y||0));}

const $ = (s, root = document) => root.querySelector(s);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusText = {unseen:'待学习',learning:'学习中',done:'已完成',skipped:'已跳过',read:'已浏览'};
const route = () => (location.hash.slice(1) || 'home').split('/');
const currentTree = () => state?.trees.find(t => t.id === route()[1]);
const currentNode = () => {const t = currentTree(); return t?.nodes.find(n => n.id === route()[2]) || t?.nodes.find(n=>n.id===t.current_node_id) || t?.nodes.find(n => n.status === 'learning') || t?.nodes[0];};
const go = hash => {if(location.hash === '#' + hash) render(); else location.hash = hash;};
function toast(text) {clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),6500);}
function setBusy(value) {busy=value;document.querySelectorAll('button').forEach(b=>{if(value){b.dataset.wasDisabled=String(b.disabled);b.disabled=true;}else if(b.dataset.wasDisabled!==undefined){b.disabled=b.dataset.wasDisabled==='true';delete b.dataset.wasDisabled;}});$('#save-status').textContent=value?'正在处理…':'已保存至本机';const hint=$('#reader-save-state');if(hint)hint.textContent=value?'正在处理，请稍等…':'阅读位置自动保存在本机';}
function modelBadge(){
  if(!config)return;
  const name=config.provider==='deepseek'?'DeepSeek':'模型服务';
  $('#mode-badge').className='badge '+(config.enabled&&config.test_status==='passed'?'live':'demo');
  $('#mode-badge').textContent=name+' · '+(!config.enabled?'待设置':config.test_status==='passed'?'已连接':config.test_status==='failed'?'连接未通过':'待测试');
  $('#mode-mini').textContent=config.enabled?'· 已设置':'';
}
function connectionResult(text,kind='wait') {const el=$('#connection-result');if(el){el.textContent=text;el.className='connection-result '+kind;}}
async function act(data, redraw = true) {
  if(busy) return null;
  setBusy(true);
  try {
    const response=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:AbortSignal.timeout(120000)});
    const result=await response.json();
    if(result.settings){config=result.settings;modelBadge();}
    if(!response.ok)throw Error((result.settings_saved?'设置已保存，但连接测试未通过：':'')+(result.error || '操作没有完成，请重试。'));
    state=result.state;config=result.settings;
    if(redraw)render();
    return result;
  } catch(error) {let message=error.name==='TimeoutError'?'等待模型超时。请稍后刷新查看，避免重复提交。':error.message;if(error.name==='TypeError')message='本地服务暂时没有连接，请重新运行“启动知枝.cmd”，再刷新页面。';toast(message);if(data.type==='configure_test'||data.type==='configure')connectionResult(message,'error');return null;}
  finally {setBusy(false);}
}

function icon(name, size=18) {

function treeSvg(tree, selected) {
  const chapters=[...new Set(tree.nodes.filter(n=>!n.parent_id).map(n=>n.chapter))],locations={};
  const children=id=>tree.nodes.filter(n=>n.parent_id===id);
  // Each chapter gets its own lane; additional chapters no longer share the first four anchors.
  const laneSizes=chapters.map(ch=>{
    const roots=tree.nodes.filter(n=>!n.parent_id&&n.chapter===ch);
    return Math.max(230, Math.ceil(roots.length/3)*120+100);
  });
  const pairSizes=[];for(let i=0;i<chapters.length;i+=2)pairSizes.push(Math.max(laneSizes[i],laneSizes[i+1]||0));
  const height=pairSizes.reduce((a,b)=>a+b,0)+180;
  let paths=`<path class="trunk" d="M500 ${height-75} Q490 ${height/2} 500 65"/>`,labels='',nodes='',offset=50;
  chapters.forEach((chapter,ci)=>{
    if(ci>0&&ci%2===0)offset+=pairSizes[ci/2-1];
    const x=ci%2===0?255:745, lane=pairSizes[Math.floor(ci/2)],y=offset+lane-35;
    const members=tree.nodes.filter(n=>!n.parent_id&&n.chapter===chapter);
    paths+=`<path class="twig" d="M500 ${y+40} Q${x} ${y+50} ${x} ${y-8}"/>`;
    labels+=`<text class="chapter-label" x="${x}" y="${y+34}">${esc(chapter.length>17?chapter.slice(0,17)+'…':chapter)}</text>`;
    members.forEach((n,j)=>{
      const row=Math.floor(j/3),count=Math.min(3,members.length-row*3),nx=x+((j%3)-(count-1)/2)*135,ny=y-68-row*120;
      locations[n.id]={x:nx,y:ny};paths+=`<path class="twig ${['done','read'].includes(n.status)?'lit':''}" d="M${x} ${y-8} Q${nx} ${y-28} ${nx} ${ny}"/>`;
    });
  });
  // Explorations remain connected to their parent; lists retain full titles for dense routes.
  const placed=new Set(Object.keys(locations));
  for(let pass=0;pass<tree.nodes.length;pass++){
    let changed=false;
    tree.nodes.filter(n=>n.parent_id&&!placed.has(n.id)).forEach(n=>{
      const p=locations[n.parent_id];if(!p)return;
      const siblings=children(n.parent_id),j=siblings.findIndex(s=>s.id===n.id),direction=p.x<500?-1:1;
      const nx=Math.max(55,Math.min(945,p.x+direction*(45+j*35))),ny=Math.max(25,p.y-63-j*8);
      locations[n.id]={x:nx,y:ny};placed.add(n.id);changed=true;
      paths+=`<path class="twig exploration ${['done','read'].includes(n.status)?'lit':''}" d="M${p.x} ${p.y} Q${p.x} ${ny} ${nx} ${ny}"/>`;
    });if(!changed)break;
  }
  tree.nodes.forEach(n=>{
    const p=locations[n.id];if(!p)return;const active=n.id===selected.id,title=n.title.length>8?n.title.slice(0,8)+'…':n.title;
    nodes+=`<g role="button" tabindex="0" class="node ${esc(n.status)}${active?' selected':''}" data-action="select-node" data-node="${n.id}" aria-label="${esc(n.title+'，'+statusText[n.status])}"><title>${esc(n.title+' · '+statusText[n.status])}</title>${active?`<circle class="halo" cx="${p.x}" cy="${p.y}" r="24"/>`:''}<circle cx="${p.x}" cy="${p.y}" r="12"/>${['done','read'].includes(n.status)?`<path class="node-check" d="m${p.x-5} ${p.y} 3 3 7-7"/>`:''}<text x="${p.x}" y="${p.y+34}">${esc(title)}</text></g>`;
  });
  return `<svg class="map-svg" viewBox="0 0 1000 ${height}" role="group" aria-label="学习树知识点导航">${paths}${labels}${nodes}<ellipse cx="500" cy="${height-64}" rx="76" ry="5" fill="#dce3cf"/><text class="root-label" x="500" y="${height-25}">每一点理解，都在这里生长</text></svg>`;
}

async function openNode(id) {const t=currentTree();if(!t)return;const r=await act({type:'visit',tree_id:t.id,node_id:id},false);if(r)go(`tree/${t.id}/${id}`);}
async function completeNode(skip=false) {
  const t=currentTree(),n=currentNode();
  if(n.status!=='done'||skip){const result=await act({type:'status',tree_id:t.id,node_id:n.id,status:skip?'skipped':'done'});if(!result)return;}
  const next=currentTree().nodes.find((x,i)=>i>t.nodes.findIndex(y=>y.id===n.id)&&!['done','skipped'].includes(x.status)) || currentTree().nodes.find(x=>!['done','skipped'].includes(x.status));
  if(next){await openNode(next.id);await act({type:'refill',tree_id:t.id,node_id:next.ready?'':next.id});}
  else toast('本次路线已经走完。你的学习树和探索经历会一直保留。');
}

window.addEventListener('pagehide',keepReaderPosition);
document.addEventListener('pointerdown',event=>{const control=event.target.closest('button,.round-control,.ask-pill,a.primary,summary');if(!control||control.disabled||matchMedia('(prefers-reduced-motion: reduce)').matches)return;control.classList.remove('jelly-tap');void control.offsetWidth;control.classList.add('jelly-tap');control.addEventListener('animationend',()=>control.classList.remove('jelly-tap'),{once:true});});

$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const rect=$('#modal').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
fetch('/api/state').then(async r=>{if(!r.ok)throw Error('无法读取本机学习资料。');return r.json();}).then(result=>{state=result.state;config=result.settings;render();if(route()[0]==='tree')restoreReaderPosition();}).catch(error=>{$('#main').textContent=error.message+' 请确认本地服务已经启动，然后刷新。';});
</script></body>
</html>
