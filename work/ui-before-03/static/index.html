<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <title>知枝 · 私人学习助手</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="知枝首页"><span class="brand-mark">✳</span><span>知枝<small>LEARNING GROVE</small></span></a>
      <button class="primary new-tree" data-action="new">＋ 开始一段学习</button>
      <nav aria-label="主导航">
        <a href="#home" data-nav="home"><span>⌘</span> 我的学习树</a>
        <a href="#profile" data-nav="profile"><span>▤</span> 个人资料库 <b id="memory-count">0</b></a>
      </nav>
      <div class="sidebar-label">正在生长</div>
      <div id="tree-nav" class="tree-nav"></div>
      <div class="sidebar-bottom">
        <div class="local-note"><i></i> 个人空间 · 保存在本机</div>
        <button class="text-button" data-action="settings">⚙ 模型设置 <span id="mode-mini"></span></button>
        <button class="text-button" data-action="export">↗ 导出学习档案</button>
        <div class="version">知枝 / 本地版 0.2</div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><span id="breadcrumbs">我的学习树</span><div><button id="mode-badge" class="badge" data-action="settings" aria-label="模型设置"></button><span class="saved" id="save-status">已保存至本机</span></div></header>
      <main id="main" tabindex="-1"><div class="loading-page">正在打开你的学习空间…</div></main>
    </div>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
